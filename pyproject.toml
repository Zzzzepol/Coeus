[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coeus-research"
version = "0.1.0"
description = "Local, evidence-first research with bounded async workers"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
coeus = "coeus.cli:main"

[tool.setuptools.packages.find]
include = ["coeus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
